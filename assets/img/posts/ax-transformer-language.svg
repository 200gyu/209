<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Badge -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="210" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="105" y="20" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">트랜스포머 · 학습 노트</text>
  </g>

  <!-- Title -->
  <text x="60" y="150" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1">AI는 어떻게 언어를 배웠나</text>
  <text x="60" y="200" fill="#93c5fd" font-size="24" font-weight="600">이미지와 언어가 각자의 벽을 넘어 → 트랜스포머로</text>

  <!-- convergence diagram (center) -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="1080" height="300" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="30" y="42" fill="#fbbf24" font-size="15" font-weight="700">두 진영이 하나의 열쇠로 만나다</text>

    <!-- image branch -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="300" height="70" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="150" y="30" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="700">이미지 진영</text>
      <text x="150" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">픽셀 패턴 → '깊이의 벽' → ResNet</text>
    </g>
    <!-- language branch -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="300" height="70" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="150" y="30" text-anchor="middle" fill="#fbcfe8" font-size="16" font-weight="700">언어 진영</text>
      <text x="150" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">단어 순서 → '순서의 벽' → Attention</text>
    </g>

    <!-- arrows to center -->
    <path d="M 330 105 L 400 120" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 330 195 L 400 180" stroke="#64748b" stroke-width="2" fill="none"/>

    <!-- transformer node -->
    <g transform="translate(410, 115)">
      <rect x="0" y="0" width="290" height="70" rx="12" fill="#0ea5e9" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="145" y="30" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="800">Transformer (2017)</text>
      <text x="145" y="52" text-anchor="middle" fill="#bae6fd" font-size="12">Attention Is All You Need</text>
    </g>

    <path d="M 700 150 L 770 150" stroke="#64748b" stroke-width="2" fill="none"/>

    <!-- LLM node -->
    <g transform="translate(780, 115)">
      <rect x="0" y="0" width="270" height="70" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="135" y="30" text-anchor="middle" fill="#a7f3d0" font-size="16" font-weight="700">현대 LLM · 멀티모달</text>
      <text x="135" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">ViT · Whisper · AlphaFold</text>
    </g>

    <!-- bottom keywords -->
    <text x="30" y="272" fill="#94a3b8" font-size="13">Q·K·V 어텐션 · Multi-Head · 사전학습→SFT→RLHF · 토큰·컨텍스트 · "검토 가능한 구조로 배치"</text>
  </g>

  <!-- Footer -->
  <text x="60" y="602" fill="#64748b" font-size="13">NEXT X R&amp;D · 모두의연구소 아이펠 AI 에이전트 1기</text>
</svg>
